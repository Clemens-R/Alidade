name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-inference.txt
      - name: Syntax and unit tests
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
      - name: Verify released checkpoint
        run: |
          python verify.py --checkpoint final_model.pt --output-dir /tmp/verification
